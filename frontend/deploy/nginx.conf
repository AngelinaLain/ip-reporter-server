server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 使用当前连接地址覆盖外部输入；后端只在 Compose 私有网络内信任此头。
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

    # 镜像卷只读。逐项放行公开文件，临时下载、锁与内部状态不会进入路由。
    location = /client-downloads/install.sh {
        alias /srv/client-bootstrap/install.sh;
        default_type text/plain;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /client-downloads/install.ps1 {
        alias /srv/client-bootstrap/install.ps1;
        default_type text/plain;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /client-downloads/latest.json {
        alias /srv/client-downloads/latest.json;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /client-downloads/latest.tsv {
        alias /srv/client-downloads/latest.tsv;
        default_type text/plain;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/client-downloads/(?<release_file>releases/v[0-9]+\.[0-9]+\.[0-9]+/(?:INSTALL-INDEX\.json|install\.tsv|SHA256SUMS\.txt|ip-reporter[-_][A-Za-z0-9._-]+\.(?:zip|tar\.gz|exe|deb|rpm)))$ {
        alias /srv/client-downloads/$release_file;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /client-downloads/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2|svg)$ { expires 1d; try_files $uri =404; }
}
